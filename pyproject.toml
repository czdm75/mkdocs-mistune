[project]
name = "mkdocs-mistune"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mistune>=3.0",
    "mkdocs>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mkdocs_custom_renderer"]

[project.entry-points."mkdocs.plugins"]
custom-renderer = "mkdocs_custom_renderer.plugin:CustomRendererPlugin"

