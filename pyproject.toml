[project]
name = "mkdocs-mistune"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mistune>=3.0",
    "mkdocs>=1.5",
]

[project.optional-dependencies]
typst = [
  "typst>=0.14"
]
yaml = [
  "PyYaml>=6.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mkdocs_mistune"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
lint = [
    "ruff"
]
test = [
    "pytest"
]

[project.entry-points."mkdocs.plugins"]
custom-renderer = "mkdocs_custom_renderer.plugin:CustomRendererPlugin"
